name: Generate Release Keystore (one-time)

# Manual-only, run once. Generates a fresh Android release signing
# keystore and uploads it as a workflow artifact — never committed to the
# repo. After running this, download the artifact, save the keystore
# somewhere safe (a password manager or secure backup), then delete this
# workflow file; it should not be run a second time against a real app
# that's already been published, since Play Store ties an app listing to
# the signing key it was first uploaded with.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.GENERATED_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore declare-release.keystore \
            -alias declare \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=Declare, OU=Declare, O=Declare, L=, ST=, C=PH"
          base64 -w0 declare-release.keystore > declare-release.keystore.b64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: declare-release-keystore
          path: |
            declare-release.keystore
            declare-release.keystore.b64
          retention-days: 7
